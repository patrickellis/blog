steps:
  # Step 1: Install Node.js dependencies from the lockfile using the official Node.js 22 image
  # This image is pulled directly from Docker Hub. Vite 8 requires Node >= 20.19 / 22.12.
  - name: "node:22"
    entrypoint: "npm"
    args: ["ci"]
    id: "npm-install"

  # Step 2: Run unit tests (tax engine + dataset integrity) – a failure blocks the deploy
  - name: "node:22"
    entrypoint: "npm"
    args: ["test"]
    id: "test"
    waitFor: ["npm-install"]

  # Step 3: Build the static site (typecheck + Vite build into dist/)
  - name: "node:22"
    entrypoint: "npm"
    args: ["run", "build"]
    id: "vite-build"
    waitFor: ["test"]

  # Step 4: Deploy to Google Cloud Storage
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "storage"
      - "rsync"
      - "-r"
      - "dist/"
      - "gs://${_BUCKET_NAME}"
    id: "deploy-to-gcs"
    waitFor: ["vite-build"]

  # Step 5: Invalidate CDN Cache
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "compute"
      - "url-maps"
      - "invalidate-cdn-cache"
      - "${_URL_MAP_NAME}"
      - "--path=/*"
    id: "invalidate-cdn"
    waitFor: ["deploy-to-gcs"]

substitutions:
  _BUCKET_NAME: "astro-blog"
  _URL_MAP_NAME: "blog-lb"

options:
  logging: CLOUD_LOGGING_ONLY
